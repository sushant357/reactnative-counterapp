sonar.organization=sushant357
sonar.projectKey=sushant357_reactnative-counterapp

sonar.projectName=reactnative-counterapp
sonar.sourceEncoding=UTF-8

# Application source files
sonar.sources=App.tsx,src

# Jest test files
sonar.tests=__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclude tests and generated files from source analysis
sonar.exclusions=**/__tests__/**,**/node_modules/**,**/coverage/**

# Jest LCOV coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info