
name: React Native - SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: Jest Tests and SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Jest tests with coverage
        run: npm test -- --coverage --runInBand

      - name: Verify LCOV report
        run: |
          test -f coverage/lcov.info
          echo "Jest LCOV report generated successfully"

      - name: SonarQube Cloud Analysis
        uses: SonarSource/sonarqube-scan-action@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
